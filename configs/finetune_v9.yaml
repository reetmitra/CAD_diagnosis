# configs/finetune_v9.yaml
# Fine-tuning from v9 pre-trained checkpoint — includes all 2026-03-31 improvements:
#   - Temporal branch architecture fix (temporal transformer now active across 32 cubes)
#   - Ordinal EMD loss for stenosis severity (reduces Healthy↔Significant confusion)
#   - Cosine warm restarts to escape local minima
#   - SWA from epoch 120 for flat-minima generalisation

pattern: fine_tuning
data_root: ./dataset/train

# Training schedule
epochs: 250
lr: 3.0e-5
weight_decay: 1.0e-4
grad_clip: 0.1
warmup_epochs: 10

# LR schedule: cosine warm restarts (T0=60, ×2 per restart)
# Effective cycles: 60 → 120 → 240 epochs.  The first restart at ep60
# shakes the model out of any early local minimum.
lr_schedule: cosine_warm_restarts
lr_t0: 60
lr_t_mult: 2

# SWA: average weights from ep120 onward — finds flatter minima
swa: true
swa_start_epoch: 120
# swa_lr defaults to lr/2 = 1.5e-5

# L_dc warm-up (same proven schedule as v7)
dc_warmup_hold: 20
dc_warmup_ramp: 30
delta: 1.0
dc_confidence_threshold: 0.3
soft_dc: true
label_smoothing: 0.1

# Ordinal loss: 0.5 weight on EMD term — penalises Healthy↔Sig more than adjacent errors
ordinal_weight: 0.5

# Early stopping
patience: 60
min_delta: 0.001

# Class imbalance handling
balanced_sampling: true
sc_class_weight: true
boost_nonsig: true
focal_loss: true
focal_gamma: 2.0
eos_coef: 0.15

# Effective batch = 2 * 1 GPU * 4 accum = 8
accumulate_steps: 4

# Training infrastructure
amp: true
ema: true
ema_decay: 0.999
layerwise_lr: true
augment: true
num_workers: 4
seed: 42
patient_split: true
split_seed: 42

# Transformer architecture (must match v9 pre-training)
temporal_encoder_layers: 4
temporal_heads: 8
spatial_encoder_layers: 4
spatial_decoder_layers: 4

# Logging
checkpoint_dir: ./checkpoints_v9_finetune
save_every: 10
print_every: 1
log_dir: ./runs
log_every: 10
