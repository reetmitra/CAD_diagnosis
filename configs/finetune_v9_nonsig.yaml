# configs/finetune_v9_nonsig.yaml
# Same as finetune_v9.yaml but with Non-sig weight boost

pattern: fine_tuning
data_root: ./dataset/train
epochs: 200
lr: 3.0e-5
weight_decay: 1.0e-4
grad_clip: 0.1
warmup_epochs: 10
dc_warmup_hold: 20
dc_warmup_ramp: 30
delta: 1.0
dc_confidence_threshold: 0.3
soft_dc: true
label_smoothing: 0.1
patience: 50
min_delta: 0.001
balanced_sampling: true
sc_class_weight: true
boost_nonsig: true
focal_loss: true
focal_gamma: 2.0
eos_coef: 0.15
accumulate_steps: 4
amp: true
ema: true
ema_decay: 0.999
layerwise_lr: true
augment: true
num_workers: 4
seed: 42
patient_split: true
split_seed: 42
temporal_encoder_layers: 4
temporal_heads: 8
spatial_encoder_layers: 4
spatial_decoder_layers: 4
checkpoint_dir: ./checkpoints_v9_nonsig
save_every: 10
print_every: 1
log_dir: ./runs
log_every: 10
